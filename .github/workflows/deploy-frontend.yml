# Builds frontend/Dockerfile and deploys it to Cloud Run on every push to main.
# GitHub holds no keys: it signs in to GCP through Workload Identity Federation, which only
# trusts pushes to main of Zetaturbo/SiemensLabs. LLM_API_KEY lives in GCP Secret Manager.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  PROJECT_ID: siemenslabs
  REGION: europe-west1
  SERVICE: frontend
  IMAGE: europe-west1-docker.pkg.dev/siemenslabs/siemenslabs/frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/723680548274/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@siemenslabs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -f frontend/Dockerfile -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE --image $IMAGE:${{ github.sha }} \
            --project $PROJECT_ID --region $REGION \
            --service-account frontend-run@$PROJECT_ID.iam.gserviceaccount.com \
            --set-secrets LLM_API_KEY=LLM_API_KEY:latest \
            --set-env-vars LLM_BASE_URL=https://integrate.api.nvidia.com/v1,LLM_MODEL=nvidia/nemotron-3-ultra-550b-a55b,LLM_REASONING=off \
            --port 3000 --memory 1Gi --min-instances 0 --max-instances 2 \
            --allow-unauthenticated
